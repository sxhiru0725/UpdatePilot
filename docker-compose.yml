services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: updatepilot
      POSTGRES_USER: updatepilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to a random password}
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U updatepilot']
      interval: 5s
      retries: 10
volumes:
  postgres-data:
